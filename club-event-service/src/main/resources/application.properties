spring.application.name=club-event-service

# Config Server — fetch config at startup (overridden by SPRING_CONFIG_IMPORT env var in Docker)
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/learnivo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Disable static data loading (use real users from user-service)
spring.sql.init.mode=never

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server (use 8085 if 8080 is in use)
server.port=8087

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.compatibility-verifier.enabled=false


# User Service Integration (from mohamed-work)
user-service.url=http://localhost:8085
user-service.api.users=/api/users
user-service.api.health=/api/test/hello

