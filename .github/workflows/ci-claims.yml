name: CI — claims-service

on:
  push:
    branches: [main]
    paths:
      - 'claims-service/**'
      - 'pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'claims-service/**'
      - 'pom.xml'
  workflow_call:
    outputs:
      result:
        description: "CI result"
        value: ${{ jobs.test.result }}

jobs:
  test:
    name: Compile & Test (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile claims-service
        run: mvn compile -pl claims-service -am -DskipTests -q

      - name: Run tests
        run: |
          mvn test -pl claims-service \
            -Deureka.client.enabled=false \
            -Dspring.cloud.config.enabled=false \
            -Dspring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claims-surefire-reports
          path: claims-service/target/surefire-reports/
          retention-days: 7
