            ${{ env.IMAGE_PREFIX }}/course-service:${{ github.sha }}

  build-quiz-service:
    name: Build quiz-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: quiz-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/quiz-service:latest
            ${{ env.IMAGE_PREFIX }}/quiz-service:${{ github.sha }}

  build-club-event-service:
