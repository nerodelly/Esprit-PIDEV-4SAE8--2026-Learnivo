          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: course-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
