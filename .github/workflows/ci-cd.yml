      - uses: docker/build-push-action@v5
        with:
          context: .
          file: club-event-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/club-event-service:latest
            ${{ env.IMAGE_PREFIX }}/club-event-service:${{ github.sha }}

  build-imed-service:
    name: "Build » imed-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: imed-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/imed-service:latest
            ${{ env.IMAGE_PREFIX }}/imed-service:${{ github.sha }}

  build-frontend:
    name: "Build » frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 4 — Deploy everything to Kubernetes
#           Waits for: all builds + claims CD + user CD
# ─────────────────────────────────────────────────────────────────────────────

  deploy:
    name: "Deploy » all services"
    runs-on: ubuntu-latest
    needs:
      - cd-claims
      - cd-user
      - build-eureka-service
      - build-config-server
      - build-api-gateway
      - build-class-service
      - build-competition-service
      - build-course-service
      - build-quiz-service
      - build-club-event-service
      - build-imed-service
      - build-frontend
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Stamp image tags in manifests
        run: |
          find k8s/ -name 'deployment.yml' -exec sed -i \
            "s|IMAGE_TAG|${{ github.sha }}|g" {} \;

      - name: Apply namespace & shared config
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/secrets.yml

      - name: Deploy infrastructure
        run: |
          kubectl apply -f k8s/mysql/
          kubectl apply -f k8s/rabbitmq/
          kubectl apply -f k8s/eureka-service/
          kubectl apply -f k8s/config-server/
          kubectl rollout status deployment/eureka-service  -n learnivo --timeout=120s
          kubectl rollout status deployment/config-server   -n learnivo --timeout=120s

      - name: Deploy microservices
        run: |
          kubectl apply -f k8s/class-service/
          kubectl apply -f k8s/competition-service/
          kubectl apply -f k8s/course-service/
          kubectl apply -f k8s/quiz-service/
          kubectl apply -f k8s/club-event-service/
          kubectl apply -f k8s/imed-service/

      - name: Deploy gateway & frontend
        run: |
          kubectl apply -f k8s/api-gateway/
          kubectl apply -f k8s/frontend/

      - name: Verify all rollouts
        run: |
          for svc in eureka-service config-server api-gateway \
            class-service competition-service course-service \
            quiz-service club-event-service imed-service frontend; do
            echo "Checking $svc..."
            kubectl rollout status deployment/$svc -n learnivo --timeout=180s
          done
