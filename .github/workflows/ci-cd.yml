name: Learnivo — Global CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nerodelly

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 1 — CI: claims-service and user-service (dedicated pipelines)
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  ci-claims:
    name: "CI » claims-service"
    uses: ./.github/workflows/ci-claims.yml
    secrets: inherit

  ci-user:
    name: "CI » user-service"
    uses: ./.github/workflows/ci-user.yml
    secrets: inherit

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 2 — CD: claims-service and user-service (only after their CI passes)
# ─────────────────────────────────────────────────────────────────────────────

  cd-claims:
    name: "CD » claims-service"
    needs: ci-claims
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-claims.yml
    secrets: inherit

  cd-user:
    name: "CD » user-service"
    needs: ci-user
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-user.yml
    secrets: inherit

# ─────────────────────────────────────────────────────────────────────────────
# PHASE 3 — Build & push all other service images (parallel)
# ─────────────────────────────────────────────────────────────────────────────

  build-eureka-service:
    name: "Build » eureka-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: eureka-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/eureka-service:latest
            ${{ env.IMAGE_PREFIX }}/eureka-service:${{ github.sha }}

  build-config-server:
    name: "Build » config-server"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: config-server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/config-server:latest
            ${{ env.IMAGE_PREFIX }}/config-server:${{ github.sha }}

  build-api-gateway:
    name: "Build » api-gateway"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: api-gateway/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api-gateway:latest
            ${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}

  build-class-service:
    name: "Build » class-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: class-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/class-service:latest
            ${{ env.IMAGE_PREFIX }}/class-service:${{ github.sha }}

  build-competition-service:
    name: "Build » competition-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: competition-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/competition-service:latest
            ${{ env.IMAGE_PREFIX }}/competition-service:${{ github.sha }}

  build-course-service:
    name: "Build » course-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: course-service/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
