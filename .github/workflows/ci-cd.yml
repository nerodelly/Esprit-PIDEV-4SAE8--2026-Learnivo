            ${{ env.IMAGE_PREFIX }}/course-service:${{ github.sha }}

  build-quiz-service:
    name: "Build » quiz-service"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
