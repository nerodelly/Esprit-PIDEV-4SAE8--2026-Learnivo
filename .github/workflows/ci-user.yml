name: CI — user-service

on:
  push:
    branches: [main]
    paths:
      - 'user-service/**'
      - 'pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'user-service/**'
      - 'pom.xml'
  workflow_call:
    outputs:
      result:
        description: "CI result"
        value: ${{ jobs.test.result }}

jobs:
  test:
    name: Compile & Test (Java 17)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: learnivo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile user-service
        run: mvn compile -pl user-service -am -DskipTests -q

      - name: Run tests
        run: |
          mvn test -pl user-service \
            -Dspring.datasource.url="jdbc:mysql://localhost:3306/learnivo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password= \
            -Dspring.security.oauth2.resourceserver.jwt.issuer-uri="" \
            -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration \
            -Deureka.client.enabled=false \
            -Dspring.cloud.config.enabled=false \
            -Dspring.rabbitmq.host=localhost \
            -Dspring.rabbitmq.port=5672 \
            -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-surefire-reports
          path: user-service/target/surefire-reports/
          retention-days: 7
