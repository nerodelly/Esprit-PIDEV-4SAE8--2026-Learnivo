spring.application.name=user-service

# Config Server — fetch config at startup (overridden by SPRING_CONFIG_IMPORT env var in Docker)
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/learnivo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/learnivo}

# Server
server.port=8085

# Eureka (discovery) configuration - register this service with the discovery server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Disable Spring Cloud compatibility verifier for development (allows newer Boot)
spring.cloud.compatibility-verifier.enabled=false

# Mail Configuration (Hazem Ankoud)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
