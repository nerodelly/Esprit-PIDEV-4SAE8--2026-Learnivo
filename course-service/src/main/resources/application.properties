spring.application.name=course-service

# Config Server — fetch config at startup (overridden by SPRING_CONFIG_IMPORT env var in Docker)
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
server.port=8083
spring.profiles.default=local
quiz.service.name=quiz-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=uploads

spring.cloud.compatibility-verifier.enabled=false
