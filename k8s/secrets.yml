# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Do NOT commit real values here.
# Populate these secrets on the cluster with:
#
#   kubectl create secret generic learnivo-secrets -n learnivo \
#     --from-literal=MYSQL_ROOT_PASSWORD='' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='' \
#     --from-literal=KEYCLOAK_ISSUER_URI='http://<keycloak-host>:8080/realms/learnivo' \
#     --from-literal=RABBITMQ_URL='amqp://rabbitmq:5672'
#
# Or use Sealed Secrets / External Secrets Operator for production.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: learnivo-secrets
  namespace: learnivo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  SPRING_DATASOURCE_PASSWORD: ""
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/learnivo"
  RABBITMQ_URL: "amqp://rabbitmq:5672"
