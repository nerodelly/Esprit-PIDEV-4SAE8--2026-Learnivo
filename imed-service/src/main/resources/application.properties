spring.application.name=imed-service

# Config Server — fetch config at startup (overridden by SPRING_CONFIG_IMPORT env var in Docker)
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
server.port=8088

# H2 file-based database (persists data across restarts)
spring.datasource.url=jdbc:h2:file:/data/imed_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.compatibility-verifier.enabled=false
