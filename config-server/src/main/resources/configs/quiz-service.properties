# ── quiz-service config ──────────────────────────────────────────────────────
server.port=8084

spring.datasource.url=jdbc:mysql://mysql-db:3306/quiz_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true

app.mail.quiz-results.enabled=false
app.mail.quiz-results.from=no-reply@learnivo.local
